name: PR 298 Xbox test package
on:
  push:
    branches: [codex/test-package-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbox-test-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69c6f5e51bd5706d6d9cc2ca540a55b2343d20d9
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: xbox-pr298-vcpkg-windows2022-v1
      - name: Bootstrap dependencies
        shell: pwsh
        run: |
          ./vcpkg/bootstrap-vcpkg.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolchain = "$pwd/vcpkg/scripts/buildsystems/vcpkg.cmake"
          foreach ($project in @('third_party/moonlight-common-c', 'libgamestream')) {
            cmake -S $project -B "$project/build" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-uwp -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0 -DTARGET_UWP=ON -DVCPKG_MANIFEST_MODE=ON "-DVCPKG_MANIFEST_DIR=$pwd" "-DVCPKG_INSTALLED_DIR=$pwd/vcpkg_installed" -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          nuget restore moonlight-xbox-dx.sln
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed test package
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content Package.appxmanifest
          $manifest.Package.Identity.Name = 'MoonlightXbox.PR298.Test'
          $manifest.Package.Identity.Publisher = 'CN=MoonlightXboxTest'
          $manifest.Package.Identity.Version = '1.18.2.298'
          $manifest.Package.Properties.DisplayName = 'Moonlight PR298 Test'
          $manifest.Package.Applications.Application.VisualElements.DisplayName = 'Moonlight PR298 Test'
          $manifest.Save("$pwd/Package.appxmanifest")
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=MoonlightXboxTest' -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $password = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          Export-PfxCertificate -Cert $cert -FilePath "$pwd/test.pfx" -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          msbuild moonlight-xbox-dx.sln /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 "/p:AppxPackageDir=$pwd/output/" /p:AppxPackageSigningEnabled=true "/p:PackageCertificateKeyFile=$pwd/test.pfx" /p:PackageCertificateThumbprint= "/p:PackageCertificatePassword=$password" /p:UapAppxPackageBuildMode=SideLoadOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'Source: https://github.com/TheElixZammuto/moonlight-xbox/pull/298; commit 69c6f5e51bd5706d6d9cc2ca540a55b2343d20d9. Experimental, not hardware validated.' | Set-Content output/BUILD-INFO.txt
          Get-ChildItem output -Recurse -File | Where-Object Extension -In '.appx','.appxbundle','.msix','.msixbundle' | Get-FileHash -Algorithm SHA256 | Format-List | Out-File output/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-PR298-Xbox-Test
          path: output/
          if-no-files-found: error
          retention-days: 30
