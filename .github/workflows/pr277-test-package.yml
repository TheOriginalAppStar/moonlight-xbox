name: PR 277 Xbox test package
on:
  push:
    branches: [codex/pr277-test-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbox-pr277-test-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: N0fix/moonlight-xbox
          ref: 382d299d93ee666670a96e7e245d4dfe3dbb8803
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: xbox-pr277-vcpkg-windows2022-release-v1
      - name: Bootstrap dependencies
        shell: pwsh
        run: |
          ./vcpkg/bootstrap-vcpkg.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolchain = "$pwd/vcpkg/scripts/buildsystems/vcpkg.cmake"
          New-Item -ItemType Directory -Force build-triplets | Out-Null
          @('set(VCPKG_TARGET_ARCHITECTURE x64)', 'set(VCPKG_CRT_LINKAGE dynamic)', 'set(VCPKG_LIBRARY_LINKAGE dynamic)', 'set(VCPKG_CMAKE_SYSTEM_NAME WindowsStore)', 'set(VCPKG_CMAKE_SYSTEM_VERSION 10.0)', 'set(VCPKG_BUILD_TYPE release)') | Set-Content build-triplets/x64-uwp.cmake
          foreach ($project in @('third_party/moonlight-common-c', 'libgamestream')) {
            cmake -S $project -B "$project/build" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-uwp "-DVCPKG_OVERLAY_TRIPLETS=$pwd/build-triplets" -DCMAKE_SYSTEM_NAME=WindowsStore "-DCMAKE_SYSTEM_VERSION=10.0" -DTARGET_UWP=ON -DVCPKG_MANIFEST_MODE=ON "-DVCPKG_MANIFEST_DIR=$pwd" "-DVCPKG_INSTALLED_DIR=$pwd/vcpkg_installed" -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          nuget restore moonlight-xbox-dx.sln
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed test package
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content Package.appxmanifest
          $manifest.Package.Identity.Name = 'MoonlightXbox.PR277.Test'
          $manifest.Package.Identity.Publisher = 'CN=MoonlightXboxTest'
          $manifest.Package.Identity.Version = '1.18.1.277'
          $manifest.Package.Properties.DisplayName = 'Moonlight PR277 Test'
          $manifest.Package.Applications.Application.VisualElements.DisplayName = 'Moonlight PR277 Test'
          $manifest.Save("$pwd/Package.appxmanifest")
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=MoonlightXboxTest' -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $password = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          Export-PfxCertificate -Cert $cert -FilePath "$pwd/test.pfx" -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          msbuild moonlight-xbox-dx.sln /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 "/p:AppxPackageDir=$pwd/output/" /p:AppxPackageSigningEnabled=true "/p:PackageCertificateKeyFile=$pwd/test.pfx" /p:PackageCertificateThumbprint= "/p:PackageCertificatePassword=$password" /p:UapAppxPackageBuildMode=SideLoadOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'Source: https://github.com/TheElixZammuto/moonlight-xbox/pull/277; commit 382d299d93ee666670a96e7e245d4dfe3dbb8803. Experimental, not hardware validated.' | Set-Content output/BUILD-INFO.txt
          Get-ChildItem output -Recurse -File | Where-Object Extension -In '.appx','.appxbundle','.msix','.msixbundle' | Get-FileHash -Algorithm SHA256 | Format-List | Out-File output/SHA256.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: xbox-pr277-vcpkg-windows2022-release-v1
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-PR277-Xbox-Test
          path: output/
          if-no-files-found: error
          retention-days: 30

